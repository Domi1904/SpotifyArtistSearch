version: '3.8'

services:
  # Backend (NestJS)
  backend:
    build: 
      context: ./spotify-bff
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_TOKEN_URL=https://accounts.spotify.com/api/token
      - SPOTIFY_API_BASE_URL=https://api.spotify.com/v1
    env_file:
      - .env
    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./spotify-frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:3000/api/spotify
    restart: unless-stopped

networks:
  default:
    driver: bridge
